# Default configuration for all experiments
# Override specific settings in experiment scripts

# Models to evaluate
models:
  small: "google/gemma-2-2b-it"  # Fast iteration
  medium:
    - "google/gemma-2-9b-it"
    - "Qwen/Qwen2.5-7B-Instruct"
    - "meta-llama/Llama-3.1-8B-Instruct"
  large:
    - "Qwen/Qwen2.5-14B-Instruct"

# Model configurations
model_config:
  torch_dtype: "bfloat16"
  device_map: "auto"
  trust_remote_code: true

# Data paths
data:
  harmful_train: "data/saladbench_train.jsonl"
  harmful_val: "data/saladbench_val.jsonl"
  harmless_train: "data/alpaca_train.jsonl"
  harmless_val: "data/alpaca_val.jsonl"
  jailbreakbench: "data/jailbreakbench.jsonl"

# Discovery settings
discovery:
  # Gradient-based
  gradient:
    n_gradient_steps: 20
    gradient_lr: 0.1
    gradient_convergence: 1e-4
    n_local_iterations: 30
    initial_kappa: 50.0
    kappa_decay: 0.9
    enable_global_search: true
    n_global_iterations: 20

  # Pure GP baseline
  pure_gp:
    n_init_random: 20
    n_iterations: 480
    acquisition_type: "ucb"
    beta: 2.0

  # Random baseline
  random:
    n_samples: 500

# Training settings
training:
  sft:
    num_epochs: 10
    batch_size: 4
    learning_rate: 1e-3
    lambda_ablate: 1.0
    lambda_add: 0.2
    lambda_retain: 1.0

  unified:
    num_epochs: 10
    batch_size: 4
    learning_rate: 1e-3
    lambda_harmful: 1.0
    lambda_harmless: 0.5
    projection_alpha: 1.0
    addition_alpha: 1.0

  rl:
    num_steps: 500
    learning_rate: 1e-4
    num_sample_generations: 4
    exploration_std: 0.1
    max_grad_norm: 1.0

# Evaluation settings
evaluation:
  judge: "strongreject"  # or "harmbench", "llamaguard"
  max_new_tokens: 512
  temperature: 0.0  # Greedy
  batch_size: 16

# Output directories
output:
  base_dir: "results"
  checkpoints: "checkpoints"
  logs: "logs"
  figures: "figures"

# Compute settings
compute:
  seed: 42
  fp16: true
  gradient_checkpointing: true
